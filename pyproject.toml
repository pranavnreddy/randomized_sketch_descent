[project]
name = "randomized-sketch-descent"
version = "0.1.0"
description = "Randomized sketch descent and sketched ADMM experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = [
    "cvxpy>=1.5",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[tool.uv]
package = false
